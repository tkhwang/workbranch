name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

# Run release-please one at a time. A run that overlaps a release PR merge
# reads a stale latest release, reopens the same version and later fails with
# "already_exists" on the tag.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Open release PR or publish release
    runs-on: ubuntu-latest

    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
