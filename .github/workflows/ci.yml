name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build, test, and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Syntax check
        run: /bin/bash -n bin/workbranch install.sh tests/run.sh

      - name: Run integration tests
        run: ./tests/run.sh

      - name: ShellCheck sources
        run: |
          find src/workbranch scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck -s bash -S warning -e SC2034 install.sh
