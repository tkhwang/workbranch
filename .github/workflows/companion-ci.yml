name: Companion CI

on:
  pull_request:
    paths:
      - "apps/companion/**"
      - ".github/workflows/companion-ci.yml"
      - "packages/contract/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/companion/**"
      - ".github/workflows/companion-ci.yml"
      - "packages/contract/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  test:
    name: Build and test companion
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm --filter @workbranch/companion typecheck

      - name: Test
        run: pnpm --filter @workbranch/companion test

      - name: Core test runner
        run: cargo test --manifest-path apps/companion/src-tauri/Cargo.toml

      - name: App bundle smoke
        run: pnpm --filter @workbranch/companion tauri build
