        <text x="12" y="121" font-size="16" fill="#9AA5CE">blog</text>
        <text x="148" y="121" text-anchor="end" font-size="16" fill="#F4EAD5">●1</text>
      </g>

      <line x1="0" y1="262" x2="566" y2="262" stroke="#2E4370"/>
      <text x="16" y="289" font-size="16" fill="#9AA5CE">WORKSPACES · 세션 없음 / 관측 불명 / 비활성</text>
      <text x="550" y="289" text-anchor="end" font-size="16" fill="#6F7FA8">2</text>
    </g>

    <text x="64" y="382" font-size="18" fill="#9AA5CE">Create and refresh with the CLI · see which agent needs you in Companion</text>
  </g>
