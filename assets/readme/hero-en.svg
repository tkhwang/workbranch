<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">workbranch</title>
  <desc id="desc">Workbranch creates one multi-repository task folder per feature, and Companion shows each task's AI agent sessions in 내 응답 대기 (waiting on you), 실행 중 (running), and 턴 종료 · 검토 (turn ended, review) columns.</desc>
  <rect width="1200" height="400" rx="24" fill="#13244B"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Apple SD Gothic Neo', 'Noto Sans KR', monospace">
    <text x="64" y="65" font-size="18" letter-spacing="2.5" fill="#9AA5CE">GIT WORKTREE TASK ORCHESTRATOR</text>
    <g transform="translate(62 80)">
    <rect width="64" height="64" rx="14" fill="#1B2F5C" stroke="#33487A" stroke-width="1.5"/>
    <circle cx="20" cy="14" r="3.4" fill="#A2583B"/>
    <circle cx="26" cy="14" r="3.4" fill="#A2583B"/>
    <circle cx="23" cy="10" r="3.4" fill="#A2583B"/>
    <rect x="21.6" y="15" width="2.8" height="7" rx="1.4" fill="#A2583B"/>
    <path d="M14 34 A22 22 0 0 1 58 34 L58 48 A8 7 0 0 1 42 48 A6 5 0 0 0 30 48 A8 7 0 0 1 14 48 Z" fill="#F4EAD5"/>
    <path d="M14 40 Q36 37 58 40 L58 48 A8 7 0 0 1 42 48 A6 5 0 0 0 30 48 A8 7 0 0 1 14 48 Z" fill="#A2583B"/>
    <ellipse cx="29" cy="29" rx="2.4" ry="3.8" fill="#A2583B"/>
    <ellipse cx="43" cy="29" rx="2.4" ry="3.8" fill="#A2583B"/>
  </g>
    <text x="144" y="130" font-size="58" font-weight="700" letter-spacing="-2" fill="#FDF4E2">workbranch</text>
    <rect x="146" y="146" width="234" height="4" rx="2" fill="#A2583B"/>
    <text x="64" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#F4EAD5">One task folder per feature.</text>
    <text x="64" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#F4EAD5">Every repo in one place.</text>

    <g transform="translate(64 244)">
      <rect width="470" height="112" rx="8" fill="#0E1B3A" stroke="#2E4370" stroke-width="2"/>
      <circle cx="22" cy="22" r="4" fill="#A2583B"/>
      <text x="38" y="29" font-size="21" fill="#F4EAD5">$ workbranch add login</text>
      <line x1="18" y1="46" x2="452" y2="46" stroke="#24365E"/>
      <path d="M28 64 V93 M28 75 H46 M28 93 H46" fill="none" stroke="#6F7FA8" stroke-width="2"/>
      <text x="52" y="72" font-size="18" fill="#F4EAD5">feat-login/</text>
      <text x="52" y="98" font-size="18" fill="#9AA5CE">frontend</text>
      <text x="162" y="98" font-size="18" fill="#9AA5CE">backend</text>
      <text x="270" y="98" font-size="18" fill="#9AA5CE">docs</text>
    </g>

    <g id="companion-board" transform="translate(570 48)">
      <text x="0" y="24" font-size="18" letter-spacing="1.8" fill="#9AA5CE">WORKBRANCH COMPANION</text>
      <text x="566" y="24" text-anchor="end" font-size="16" fill="#6F7FA8">2 projects · 5 tasks</text>
      <rect x="0" y="46" width="566" height="258" rx="7" fill="#0E1B3A" stroke="#2E4370" stroke-width="2"/>
      <rect x="0" y="46" width="4" height="258" rx="2" fill="#A2583B"/>
      <line x1="188.7" y1="46" x2="188.7" y2="262" stroke="#24365E"/>
      <line x1="377.3" y1="46" x2="377.3" y2="262" stroke="#24365E"/>
      <line x1="0" y1="112" x2="566" y2="112" stroke="#2E4370"/>
      <circle cx="20" cy="72" r="5" fill="#E3A17B"/>
      <text x="32" y="79" font-size="20" font-weight="700" fill="#FDF4E2">내 응답 대기</text>
      <text x="174" y="102" text-anchor="end" font-size="18" fill="#9AA5CE">1</text>
      <text x="32" y="102" font-size="16" letter-spacing="1" fill="#6F7FA8">WAITING</text>
      <circle cx="208.7" cy="72" r="5" fill="#74C99B"/>
      <text x="220.7" y="79" font-size="20" font-weight="700" fill="#FDF4E2">실행 중</text>
      <text x="362.7" y="102" text-anchor="end" font-size="18" fill="#9AA5CE">1</text>
      <text x="220.7" y="102" font-size="16" letter-spacing="1" fill="#6F7FA8">RUNNING</text>
      <circle cx="397.4" cy="72" r="5" fill="#DFC075"/>
      <text x="409.4" y="79" font-size="20" font-weight="700" fill="#FDF4E2">턴 종료 · 검토</text>
      <text x="551.4" y="102" text-anchor="end" font-size="18" fill="#9AA5CE">1</text>
      <text x="409.4" y="102" font-size="16" letter-spacing="1" fill="#6F7FA8">REVIEW</text>

      <g id="card-waiting" transform="translate(14 124)">
        <rect x="-3" y="-3" width="166" height="134" rx="8" fill="none" stroke="#E3A17B" stroke-opacity="0.4" stroke-width="2"/>
        <rect width="160" height="128" rx="6" fill="#182A52" stroke="#D97757" stroke-opacity="0.55" stroke-width="1.5"/>
        <text x="12" y="23" font-size="16" fill="#6F7FA8">my-app</text>
        <g fill="none" stroke="#9AA5CE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M108 12 L104 17.5 L108 23 M114 12 L118 17.5 L114 23"/>
          <path d="M124 13 L128.5 17.5 L124 22 M130 22.5 H135"/>
          <path d="M140 13.5 H145 L146.5 15.5 H153 V23 H140 Z"/>
        </g>
        <text x="12" y="47" font-size="18" font-weight="700" fill="#FDF4E2">feat-login</text>
        <rect x="12" y="57" width="112" height="22" rx="11" fill="#E3A17B" fill-opacity="0.16"/>
        <text x="22" y="73" font-size="15" fill="#E3A17B">권한 승인 대기</text>
        <path d="M144 68 l0 -8 M144 68 l5.7 -5.7 M144 68 l8 0 M144 68 l5.7 5.7 M144 68 l0 8 M144 68 l-5.7 5.7 M144 68 l-8 0 M144 68 l-5.7 -5.7" stroke="#D97757" stroke-width="2.4" stroke-linecap="round"/>
        <text x="12" y="101" font-size="16" fill="#9AA5CE">frontend</text>
        <text x="148" y="101" text-anchor="end" font-size="16" fill="#F4EAD5">●2</text>
        <text x="12" y="121" font-size="16" fill="#9AA5CE">backend</text>
        <text x="148" y="121" text-anchor="end" font-size="16" fill="#F4EAD5">↑1</text>
      </g>
      <g id="card-running" transform="translate(202.7 124)">
        <rect width="160" height="128" rx="6" fill="#182A52" stroke="#5CC2E0" stroke-opacity="0.55" stroke-width="1.5"/>
        <text x="12" y="23" font-size="16" fill="#6F7FA8">my-app</text>
        <g fill="none" stroke="#9AA5CE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M108 12 L104 17.5 L108 23 M114 12 L118 17.5 L114 23"/>
          <path d="M124 13 L128.5 17.5 L124 22 M130 22.5 H135"/>
          <path d="M140 13.5 H145 L146.5 15.5 H153 V23 H140 Z"/>
        </g>
        <text x="12" y="47" font-size="18" font-weight="700" fill="#FDF4E2">search-api</text>
        <rect x="12" y="57" width="64" height="22" rx="11" fill="#74C99B" fill-opacity="0.16"/>
        <text x="22" y="73" font-size="15" fill="#74C99B">실행 중</text>
        <polygon points="144,60 151,64 151,72 144,76 137,72 137,64" fill="none" stroke="#5CC2E0" stroke-width="2.2" stroke-linejoin="round"/>
        <text x="12" y="101" font-size="16" fill="#9AA5CE">api</text>
        <text x="148" y="101" text-anchor="end" font-size="16" fill="#F4EAD5">↓3</text>
        <text x="12" y="121" font-size="16" fill="#9AA5CE">web</text>
        <text x="148" y="121" text-anchor="end" font-size="16" fill="#6F7FA8">CLEAN</text>
      </g>
      <g id="card-finished" transform="translate(391.4 124)">
        <rect width="160" height="128" rx="6" fill="#182A52" stroke="#D97757" stroke-opacity="0.55" stroke-width="1.5"/>
        <text x="12" y="23" font-size="16" fill="#6F7FA8">blog</text>
        <g fill="none" stroke="#9AA5CE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M108 12 L104 17.5 L108 23 M114 12 L118 17.5 L114 23"/>
          <path d="M124 13 L128.5 17.5 L124 22 M130 22.5 H135"/>
          <path d="M140 13.5 H145 L146.5 15.5 H153 V23 H140 Z"/>
        </g>
        <text x="12" y="47" font-size="18" font-weight="700" fill="#FDF4E2">release-notes</text>
        <rect x="12" y="57" width="70" height="22" rx="11" fill="#DFC075" fill-opacity="0.16"/>
        <text x="22" y="73" font-size="15" fill="#DFC075">턴 종료</text>
        <path d="M144 68 l0 -8 M144 68 l5.7 -5.7 M144 68 l8 0 M144 68 l5.7 5.7 M144 68 l0 8 M144 68 l-5.7 5.7 M144 68 l-8 0 M144 68 l-5.7 -5.7" stroke="#D97757" stroke-width="2.4" stroke-linecap="round"/>
