<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">workbranch</title>
  <desc id="desc">Workbranch creates one multi-repository task folder per feature and shows active work in PLAN, EXECUTION, and REVIEW stages in Companion.</desc>
  <rect width="1200" height="400" rx="24" fill="#13244B"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="65" font-size="18" letter-spacing="2.5" fill="#9AA5CE">GIT WORKTREE TASK ORCHESTRATOR</text>
    <g transform="translate(62 80)">
    <rect width="64" height="64" rx="14" fill="#1B2F5C" stroke="#33487A" stroke-width="1.5"/>
    <circle cx="20" cy="14" r="3.4" fill="#A2583B"/>
    <circle cx="26" cy="14" r="3.4" fill="#A2583B"/>
    <circle cx="23" cy="10" r="3.4" fill="#A2583B"/>
    <rect x="21.6" y="15" width="2.8" height="7" rx="1.4" fill="#A2583B"/>
    <path d="M14 34 A22 22 0 0 1 58 34 L58 48 A8 7 0 0 1 42 48 A6 5 0 0 0 30 48 A8 7 0 0 1 14 48 Z" fill="#F4EAD5"/>
    <path d="M14 40 Q36 37 58 40 L58 48 A8 7 0 0 1 42 48 A6 5 0 0 0 30 48 A8 7 0 0 1 14 48 Z" fill="#A2583B"/>
    <ellipse cx="29" cy="29" rx="2.4" ry="3.8" fill="#A2583B"/>
    <ellipse cx="43" cy="29" rx="2.4" ry="3.8" fill="#A2583B"/>
  </g>
    <text x="144" y="130" font-size="58" font-weight="700" letter-spacing="-2" fill="#FDF4E2">workbranch</text>
    <rect x="146" y="146" width="234" height="4" rx="2" fill="#A2583B"/>
    <text x="64" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#F4EAD5">One task folder per feature.</text>
    <text x="64" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#F4EAD5">Every repo in one place.</text>

    <g transform="translate(64 244)">
      <rect width="470" height="112" rx="8" fill="#0E1B3A" stroke="#2E4370" stroke-width="2"/>
      <circle cx="22" cy="22" r="4" fill="#A2583B"/>
      <text x="38" y="29" font-size="21" fill="#F4EAD5">$ workbranch add login</text>
      <line x1="18" y1="46" x2="452" y2="46" stroke="#24365E"/>
      <path d="M28 64 V93 M28 75 H46 M28 93 H46" fill="none" stroke="#6F7FA8" stroke-width="2"/>
      <text x="52" y="72" font-size="18" fill="#F4EAD5">feat-login/</text>
      <text x="52" y="98" font-size="18" fill="#9AA5CE">frontend</text>
      <text x="162" y="98" font-size="18" fill="#9AA5CE">backend</text>
      <text x="270" y="98" font-size="18" fill="#9AA5CE">docs</text>
    </g>

    <g transform="translate(570 48)">
      <text x="0" y="24" font-size="18" letter-spacing="1.8" fill="#9AA5CE">WORKBRANCH COMPANION</text>
      <text x="566" y="24" text-anchor="end" font-size="16" fill="#6F7FA8">2 projects · 6 tasks</text>
      <rect x="0" y="46" width="566" height="258" rx="7" fill="#0E1B3A" stroke="#2E4370" stroke-width="2"/>
      <rect x="0" y="46" width="4" height="258" rx="2" fill="#A2583B"/>
      <line x1="188.7" y1="46" x2="188.7" y2="304" stroke="#24365E"/>
      <line x1="377.3" y1="46" x2="377.3" y2="304" stroke="#24365E"/>
      <line x1="0" y1="112" x2="566" y2="112" stroke="#2E4370"/>

      <text x="94" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="#FDF4E2">PLAN</text>
      <text x="283" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="#FDF4E2">EXECUTION</text>
      <text x="472" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="#FDF4E2">REVIEW</text>
      <text x="94" y="101" text-anchor="middle" font-size="18" fill="#9AA5CE">AI·ME  2</text>
      <text x="283" y="101" text-anchor="middle" font-size="18" fill="#9AA5CE">AI  3</text>
      <text x="472" y="101" text-anchor="middle" font-size="18" fill="#9AA5CE">ME  1</text>

      <g transform="translate(14 128)">
        <rect width="160" height="78" rx="5" fill="#182A52" stroke="#2E4370"/>
        <circle cx="16" cy="17" r="4" fill="#D7BA7D"/>
        <text x="28" y="23" font-size="18" fill="#F4EAD5">search-refactor</text>
        <text x="14" y="49" font-size="16" fill="#9AA5CE">api · web</text>
        <text x="14" y="68" font-size="16" fill="#6F7FA8">Plan 2 / 5</text>
      </g>
      <g transform="translate(203 128)">
        <rect width="160" height="104" rx="5" fill="#182A52" stroke="#2E4370"/>
        <rect width="3" height="104" rx="1.5" fill="#A2583B"/>
        <circle cx="17" cy="17" r="4" fill="#A2583B"/>
        <text x="29" y="23" font-size="18" fill="#F4EAD5">feat-login</text>
        <text x="14" y="49" font-size="16" fill="#9AA5CE">frontend*</text>
        <text x="14" y="69" font-size="16" fill="#9AA5CE">backend</text>
        <text x="14" y="93" font-size="16" fill="#E0A48F">blocked · +1</text>
      </g>
      <g transform="translate(392 128)">
        <rect width="160" height="78" rx="5" fill="#182A52" stroke="#2E4370"/>
        <circle cx="16" cy="17" r="4" fill="#7DAFD9"/>
        <text x="28" y="23" font-size="18" fill="#F4EAD5">release-docs</text>
        <text x="14" y="49" font-size="16" fill="#9AA5CE">workbranch</text>
        <text x="14" y="68" font-size="16" fill="#6F7FA8">Review 4 / 4</text>
      </g>
      <text x="283" y="282" text-anchor="middle" font-size="18" fill="#9AA5CE">PLAN  →  EXECUTION  →  REVIEW</text>
    </g>

    <text x="64" y="382" font-size="18" fill="#9AA5CE">Create and refresh with the CLI · scan stages in Companion</text>
  </g>
</svg>
